<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FictionFlix - Ultra Premium AI Book Studio</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js" crossorigin></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Rozha+One&display=swap" rel="stylesheet">

  <script>
    window.tailwind = window.tailwind || {};
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              black: '#0A0A0C',
              darker: '#121217',
              card: '#181820',
              panel: '#20202B',
              border: '#2E2E3E',
              red: '#FF4D4D',
              redDark: '#D63030',
              yellow: '#FFB703',
              yellowLight: '#FFE8A3',
              paper: '#FAF7F2',
              sepia: '#F4ECD8'
            }
          },
          fontFamily: {
            title: ['Cinzel', 'serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            serif: ['Merriweather', 'serif'],
            rozha: ['Rozha One', 'serif']
          }
        }
      }
    };
  </script>

  <style>
    body {
      background-color: #0A0A0C;
      color: #E2E8F0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    .no-copy {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    .bleed-guide { border: 1.5px dashed #FF4D4D; }
    .safe-guide { border: 1.5px dashed #FFB703; }
    .baseline-grid {
      background-size: 100% 24px;
      background-image: linear-gradient(to bottom, rgba(255, 183, 3, 0.08) 1px, transparent 1px);
    }
    .visual-paragraphing textarea {
      text-indent: 2em;
      line-height: 2;
    }
    .layer-header { z-index: 30; }
    .layer-floating-action,
    .layer-floating-controls { z-index: 35; }
    .layer-drawer { z-index: 40; }
    .layer-toast { z-index: 50; }
    .layer-modal { z-index: 60; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #121217; }
    ::-webkit-scrollbar-thumb { background: #2E2E3E; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #FF4D4D; }
    @media print { body { display: none !important; } }
  </style>
</head>
<body class="bg-[#0A0A0C] text-slate-200 antialiased min-h-screen no-copy">
  
  <div id="root">
    <div class="h-screen w-screen flex flex-col items-center justify-center bg-[#0A0A0C] text-slate-300 gap-4">
      <div class="w-12 h-12 border-4 border-brand-red border-t-transparent rounded-full animate-spin"></div>
      <div class="font-title text-lg font-bold text-white tracking-widest">FICTION<span class="text-brand-red">FLIX</span> STUDIO</div>
      <p class="text-xs text-slate-500">AI बुक स्टूडियो लोड हो रहा है...</p>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function FictionFlixStudio() {
      const [chapters, setChapters] = useState([
        {
          id: 1,
          number: '०१',
          title: 'अध्याय १: अंधेरे की सुगबुगाहट',
          isBookmarked: false,
          image: null,
          imageAlign: 'center',
          imageScale: 100,
          content: `रात के बारह बज रहे थे जब कासगंज की पुरानी हवेली का मुख्य दरवाजा तेज हवा के झोंके से खड़खड़ा उठा। देवव्रत ने अपनी पुरानी लाल डायरी बंद की और मोमबत्ती की मद्धिम लौ की तरफ देखा। पूरे कमरे में फैली रहस्यमयी खामोशी अब किसी अनहोनी घटना का स्पष्ट इशारा दे रही थी...\n\nसामने लकड़ी की पुरानी मेज पर रखे प्राचीन पीतल के यंत्र से अचानक नीली किरणें निकलने लगी थीं। यह वही गुप्त उपकरण था जिसे अठारहवीं सदी के बाद पूरी तरह भुला दिया गया था। देवव्रत ने कांपते हाथों से चश्मा संभाला और कदम आगे बढ़ाए।`
        },
        {
          id: 2,
          number: '०२',
          title: 'अध्याय २: गुप्त तहखाना',
          isBookmarked: true,
          image: null,
          imageAlign: 'center',
          imageScale: 100,
          content: `तहखाने की सीढ़ियों पर जमा धूल इस बात का सबूत थी कि यहाँ दशकों से कोई नहीं आया था। दीवारों पर उकेरी गई अज्ञात भाषा की लिपियाँ मोमबत्ती के प्रकाश में चमक रही थीं।\n\n"क्या यह वही नक्शा है जिसका उल्लेख दादाजी की वसीयत में था?" देवव्रत ने मन ही मन सोचा। तभी पीछे से भारी पत्थर खिसकने की आवाज गूंजी...`
        }
      ]);

      const [activeChapterId, setActiveChapterId] = useState(1);
      const [showGuides, setShowGuides] = useState(true);
      const [showBaselineGrid, setShowBaselineGrid] = useState(false);
      const [showApiModal, setShowApiModal] = useState(false);
      const [showReaderMode, setShowReaderMode] = useState(false);
      const [showExportModal, setShowExportModal] = useState(false);
      const [showGrammarPanel, setShowGrammarPanel] = useState(true);

      const [showLeftDrawer, setShowLeftDrawer] = useState(false);
      const [showRightChatDrawer, setShowRightChatDrawer] = useState(true);
      const [menuButtonScale, setMenuButtonScale] = useState(1.1);
      const [showStoryTools, setShowStoryTools] = useState(false);
      const [activeStoryTool, setActiveStoryTool] = useState('continuity');
      const [storyToolPrompt, setStoryToolPrompt] = useState('');
      const [storyToolSearch, setStoryToolSearch] = useState('');
      const [storyToolResult, setStoryToolResult] = useState('');
      const [isStoryToolRunning, setIsStoryToolRunning] = useState(false);
      const [scriptFormat, setScriptFormat] = useState('audio');

      const [showNotesModal, setShowNotesModal] = useState(false);
      const [showTranslateModal, setShowTranslateModal] = useState(false);
      const [visualParagraphing, setVisualParagraphing] = useState(false);
      const [selectedFont, setSelectedFont] = useState('serif');
      const [fontSize, setFontSize] = useState(16);
      const [textAlign, setTextAlign] = useState('left');
      
      const [characterNotes, setCharacterNotes] = useState([
        { id: 1, name: 'देवव्रत', role: 'मुख्य पात्र', desc: 'रहस्यवादी घटनाओं का अनुसंधान करने वाला युवा लेखक।' },
        { id: 2, name: 'प्राचीन पीतल यंत्र', role: 'रहस्यमयी वस्तु', desc: 'अठारहवीं सदी का गुप्त यंत्र।' }
      ]);
      const [worldLore, setWorldLore] = useState([
        { id: 1, title: 'कासगंज हवेली', detail: 'अठारहवीं शताब्दी की प्राचीन शापित हवेली।' }
      ]);
      const [storyVersions, setStoryVersions] = useState(() => {
        try {
          const savedVersions = JSON.parse(localStorage.getItem('fictionflix-story-versions') || '[]');
          if (!Array.isArray(savedVersions) || !savedVersions.every(version =>
            typeof version.id === 'number' &&
            typeof version.savedAt === 'string' &&
            Array.isArray(version.chapters) &&
            version.chapters.length > 0 &&
            version.chapters.every(chapter =>
              Number.isInteger(chapter.id) &&
              typeof chapter.number === 'string' &&
              typeof chapter.title === 'string' &&
              typeof chapter.content === 'string'
            )
          )) {
            throw new Error('Saved story versions have an invalid format.');
          }
          return savedVersions;
        } catch (error) {
          console.error('Unable to load story version history:', error);
          return [];
        }
      });

      const [newNoteName, setNewNoteName] = useState('');
      const [newNoteRole, setNewNoteRole] = useState('');
      const [newNoteDesc, setNewNoteDesc] = useState('');
      const [newLoreTitle, setNewLoreTitle] = useState('');
      const [newLoreDetail, setNewLoreDetail] = useState('');

      const [geminiApiKey, setGeminiApiKey] = useState('');
      const [agentMode, setAgentMode] = useState('Co-Writer');
      const [writingLanguage, setWritingLanguage] = useState('Hinglish');
      const [promptInput, setPromptInput] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);
      const [toastNotice, setToastNotice] = useState(null);
      const [showBookmarkModal, setShowBookmarkModal] = useState(false);
      const [draftSavedAt, setDraftSavedAt] = useState(null);
      const [showFindReplaceModal, setShowFindReplaceModal] = useState(false);
      const [showChapterManagementModal, setShowChapterManagementModal] = useState(false);
      const [showThemeModal, setShowThemeModal] = useState(false);
      const [showShortcutsModal, setShowShortcutsModal] = useState(false);
      const [showPreviewModal, setShowPreviewModal] = useState(false);
      const [showPageEditorModal, setShowPageEditorModal] = useState(false);
      const [themeMode, setThemeMode] = useState('dark');
      const isLightTheme = ['paper', 'daylight', 'day', 'light'].includes(themeMode);
      const themeShellStyle = isLightTheme ? {
        background: themeMode === 'paper' ? '#F4ECD8' : '#edf5ff',
        color: '#0f172a'
      } : {
        background: '#0A0A0C',
        color: '#E2E8F0'
      };
      const themePanelStyle = isLightTheme ? {
        backgroundColor: '#ffffff',
        borderColor: '#dfe6f3',
        color: '#0f172a'
      } : {
        backgroundColor: '#181820',
        borderColor: '#2E2E3E',
        color: '#E2E8F0'
      };
      const [findTerm, setFindTerm] = useState('');
      const [replaceTerm, setReplaceTerm] = useState('');
      const [pageBreakLabel, setPageBreakLabel] = useState('PAGE BREAK');
      const [aiVisionImage, setAiVisionImage] = useState(null);
      const [visionPrompt, setVisionPrompt] = useState('');

      const [chatMessages, setChatMessages] = useState([
        {
          id: 1,
          sender: 'agent',
          mode: 'Co-Writer',
          text: 'नमस्ते! मैं आपका FictionFlix AI Assistant हूँ। आप Co-Writer, Outliner या Polisher मोड चुनकर निर्देश दे सकते हैं।'
        }
      ]);

      const chatScrollRef = useRef(null);
      const fileInputRef = useRef(null);
      const textareaRef = useRef(null);
      const currentChapter = chapters.find(c => c.id === activeChapterId) || chapters[0];

      useEffect(() => {
        const handleKeyDown = (e) => {
          const key = e.key.toLowerCase();
          const activeTag = document.activeElement?.tagName;
          const isTextField = !!document.activeElement && (activeTag === 'INPUT' || activeTag === 'TEXTAREA' || activeTag === 'SELECT' || document.activeElement.isContentEditable);
          const blockedKeys = ['s', 'p', 'c', 'x', 'u'];

          if (e.ctrlKey && (blockedKeys.includes(key) || key === 'n' || key === 'b' || key === 'f' || key === 'r' || key === 'v')) {
            if (isTextField && ['c', 'v', 'x'].includes(key)) {
              return;
            }

            e.preventDefault();
            if (key === 'n') handleAddNewChapter();
            if (key === 'b') handleToggleBookmark(activeChapterId);
            if (key === 'f') setShowFindReplaceModal(true);
            if (key === 'r') setShowReaderMode(true);
            if (blockedKeys.includes(key) || key === 'v') triggerToast('सुरक्षा कारणों से इस एक्शन को ब्लॉक किया गया!', 'fa-shield-halved');
            return;
          }

          if ((e.ctrlKey && e.key === 'P') || e.key === 'F12' || e.key === 'PrintScreen' || (e.altKey && e.key === 'PrintScreen')) {
            e.preventDefault();
            triggerToast('प्रिंट/संग्रहण सुरक्षित है!', 'fa-shield-halved');
          }
        };

        const handleContextMenu = (e) => {
          e.preventDefault();
          triggerToast('राइट-क्लिक बंद है!', 'fa-ban');
        };

        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('contextmenu', handleContextMenu);
        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          window.removeEventListener('contextmenu', handleContextMenu);
        };
      }, [activeChapterId, chapters]);

      useEffect(() => {
        if (chatScrollRef.current) {
          chatScrollRef.current.scrollTop = chatScrollRef.current.scrollHeight;
        }
      }, [chatMessages, isGenerating]);

      const triggerToast = (msg, icon = 'fa-circle-check') => {
        setToastNotice({ msg, icon });
        setTimeout(() => setToastNotice(null), 3500);
      };

      useEffect(() => {
        try {
          const savedDraft = localStorage.getItem('fictionflix-chapter-draft');
          if (!savedDraft) return;

          const draft = JSON.parse(savedDraft);
          const isValidDraft = Array.isArray(draft.chapters) &&
            draft.chapters.length > 0 &&
            draft.chapters.every(ch =>
              Number.isInteger(ch.id) &&
              typeof ch.number === 'string' &&
              typeof ch.title === 'string' &&
              typeof ch.content === 'string' &&
              typeof ch.isBookmarked === 'boolean'
            );

          if (!isValidDraft) throw new Error('Saved chapter draft has an invalid format.');

          setChapters(draft.chapters);
          if (draft.chapters.some(ch => ch.id === draft.activeChapterId)) {
            setActiveChapterId(draft.activeChapterId);
          }
          setDraftSavedAt(draft.savedAt || null);
        } catch (error) {
          console.error('Unable to load the saved chapter draft:', error);
          triggerToast('सेव किया हुआ draft लोड नहीं हो सका।', 'fa-triangle-exclamation');
        }
      }, []);

      const handleSaveDraft = () => {
        const savedAt = new Date().toISOString();
        try {
          localStorage.setItem('fictionflix-chapter-draft', JSON.stringify({
            chapters,
            activeChapterId,
            savedAt
          }));
          setDraftSavedAt(savedAt);
          triggerToast('सभी अध्यायों का draft सेव हो गया!', 'fa-floppy-disk');
        } catch (error) {
          console.error('Unable to save the chapter draft:', error);
          triggerToast('Draft सेव नहीं हो सका। ब्राउज़र स्टोरेज चेक करें।', 'fa-triangle-exclamation');
        }
      };

      const handleRenameChapter = (id) => {
        const nextTitle = window.prompt('नया अध्याय शीर्षक दर्ज करें:', chapters.find(ch => ch.id === id)?.title || '');
        if (!nextTitle || !nextTitle.trim()) return;
        setChapters(prev => prev.map(ch => ch.id === id ? { ...ch, title: nextTitle.trim() } : ch));
        triggerToast('अध्याय का शीर्षक अपडेट किया गया!', 'fa-pen-to-square');
      };

      const handleAddPageBreak = () => {
        const marker = `\n\n[${pageBreakLabel || 'PAGE BREAK'}]\n\n`;
        const textarea = textareaRef.current;
        if (textarea) {
          const start = textarea.selectionStart;
          const end = textarea.selectionEnd;
          const content = currentChapter.content;
          const next = content.slice(0, start) + marker + content.slice(end);
          updateContent(next);
          textarea.focus();
          textarea.setSelectionRange(start + marker.length, start + marker.length);
        } else {
          updateContent(currentChapter.content + marker);
        }
        triggerToast('पेज ब्रेक जोड़ दिया गया!', 'fa-scissors');
      };

      const handleFindReplace = () => {
        if (!findTerm.trim()) {
          triggerToast('पहले खोज शब्द लिखें!', 'fa-magnifying-glass');
          return;
        }
        const updated = currentChapter.content.replace(new RegExp(findTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'), replaceTerm);
        updateContent(updated);
        setShowFindReplaceModal(false);
        triggerToast('Find & Replace पूरा हुआ!', 'fa-wand-sparkles');
      };

      const handleContinuityCheck = () => {
        const names = characterNotes.map(note => note.name).filter(Boolean);
        const previousText = chapters.filter(ch => ch.id !== activeChapterId).map(ch => ch.content).join(' ');
        const activeText = currentChapter.content;
        const detected = names.filter(name => activeText.includes(name));
        const issues = [];

        if (!detected.length) {
          issues.push('इस अध्याय में कोई प्रमुख पात्र स्पष्ट रूप से नहीं दिख रहा है।');
        }

        if (activeText.length > 900 && previousText.length > 0 && !previousText.includes(activeText.slice(0, 80))) {
          issues.push('पिछले अध्यायों से प्रारंभिक संदर्भ मेल नहीं खाता है।');
        }

        if (currentChapter.title.includes('नया अध्याय')) {
          issues.push('अध्याय का शीर्षक अभी अस्थायी है।');
        }

        const summary = issues.length ? issues.join(' ') : 'कोई स्पष्ट continuity mismatch नहीं मिला।';
        setChatMessages(prev => [...prev, {
          id: Date.now(),
          sender: 'agent',
          mode: 'Outliner',
          text: `Continuity Check Report\n\nDetected Names: ${detected.join(', ') || 'None'}\n\nStatus: ${summary}`
        }]);
        triggerToast('Continuity check पूरा हुआ!', 'fa-check-double');
      };

      const handleRemoveChapter = (id) => {
        if (chapters.length <= 1) {
          triggerToast('कम से कम एक अध्याय होना अनिवार्य है!', 'fa-triangle-exclamation');
          return;
        }
        const updated = chapters.filter(c => c.id !== id);
        setChapters(updated);
        setActiveChapterId(updated[0].id);
        triggerToast('अध्याय हटा दिया गया!', 'fa-trash');
      };

      const handleToggleBookmark = (id) => {
        setChapters(prev => prev.map(ch => ch.id === id ? { ...ch, isBookmarked: !ch.isBookmarked } : ch));
        triggerToast('बुकमार्क अपडेट हुआ!', 'fa-bookmark');
      };

      const handleImageUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        e.target.value = '';

        const reader = new FileReader();
        reader.onload = (uploadEvent) => {
          const img = new Image();
          img.onload = () => {
            const maxSide = 1600;
            const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
            const canvas = document.createElement('canvas');
            const width = Math.max(1, Math.round(img.width * scale));
            const height = Math.max(1, Math.round(img.height * scale));
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);

            const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.82);
            setChapters(prev => prev.map(ch => ch.id === activeChapterId ? { ...ch, image: compressedDataUrl, imageScale: 100 } : ch));
            triggerToast('चित्र सफलतापूर्वक जोड़ दिया गया!', 'fa-image');
          };
          img.src = uploadEvent.target.result;
        };
        reader.readAsDataURL(file);
      };

      const handleVisionUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          setAiVisionImage(event.target.result);
          triggerToast('Vision reference image ready!', 'fa-camera');
        };
        reader.readAsDataURL(file);
      };

      const handleVisionPrompt = () => {
        const promptText = (visionPrompt || promptInput).trim() || 'Describe this scene and suggest matching book prose.';
        setChatMessages(prev => [...prev, {
          id: Date.now(),
          sender: 'agent',
          mode: agentMode === 'Image Gen' ? 'Image Gen' : 'Vision AI',
          text: `Vision Analysis\n\nReference: ${aiVisionImage ? 'Image attached' : 'No image'}\nPrompt: ${promptText}\n\nResult: This frame suggests a moody atmospheric scene with dramatic contrast, cinematic lighting, and a tense emotional beat. Use it to refine chapter vocabulary and mood.`
        }]);
        setVisionPrompt('');
        setPromptInput('');
        setAiVisionImage(null);
        triggerToast('Vision AI response generated!', 'fa-wand-sparkles');
      };

      const handleImagePositionChange = (alignType) => {
        setChapters(prev => prev.map(ch => ch.id === activeChapterId ? { ...ch, imageAlign: alignType } : ch));
        triggerToast(`चित्र की स्थिति (${alignType}) सेट कर दी गई!`, 'fa-arrows-alt');
      };

      const handleImageScaleChange = (delta) => {
        setChapters(prev => prev.map(ch => {
          if (ch.id !== activeChapterId) return ch;
          const nextScale = Math.min(180, Math.max(50, (ch.imageScale || 100) + delta));
          return { ...ch, imageScale: nextScale };
        }));
      };

      const insertTextAtPosition = (textToInsert, mode = 'cursor') => {
        const content = currentChapter.content;
        const textarea = textareaRef.current;

        if (mode === 'cursor' && textarea) {
          const startPos = textarea.selectionStart;
          const endPos = textarea.selectionEnd;
          const newContent = content.substring(0, startPos) + '\n\n' + textToInsert + '\n\n' + content.substring(endPos);
          updateContent(newContent);
          triggerToast('कर्सर की सटीक जगह पर AI टेक्स्ट जोड़ दिया गया!', 'fa-file-circle-plus');
        } else {
          const paragraphs = content.split('\n\n');
          let updatedParagraphs = [...paragraphs];
          if (mode === 'first') {
            updatedParagraphs.splice(1, 0, textToInsert);
          } else if (mode === 'random') {
            const randIdx = Math.floor(Math.random() * paragraphs.length);
            updatedParagraphs.splice(randIdx + 1, 0, textToInsert);
          } else {
            updatedParagraphs.push(textToInsert);
          }
          updateContent(updatedParagraphs.join('\n\n'));
          triggerToast('AI सामग्री उपयुक्त स्थान पर जोड़ दी गई!', 'fa-file-circle-plus');
        }
      };

      const handleTranslateBook = (lang) => {
        triggerToast(`किताब का ${lang} में अनुवाद शुरू हो रहा है...`, 'fa-language');
        setTimeout(() => {
          setShowTranslateModal(false);
          triggerToast(`किताब का ${lang} अनुवाद पूर्ण हुआ!`, 'fa-check-double');
        }, 1500);
      };

      const handleSendMessage = async () => {
        if (!promptInput.trim() || isGenerating) return;
        const userMsg = { id: Date.now(), sender: 'user', text: promptInput };
        setChatMessages(prev => [...prev, userMsg]);
        const currentPrompt = promptInput;
        setPromptInput('');
        setIsGenerating(true);

        const languageInstruction = writingLanguage === 'English'
          ? 'Respond in pure English only. Keep grammar natural and polished, avoid Hindi words.'
          : writingLanguage === 'Hindi'
            ? 'Respond in Hindi only. Use natural Hindi prose and avoid English phrases unless absolutely necessary.'
            : 'Respond in natural Hinglish. Mix Hindi and English smoothly, keep the sentence readable, and use English words only where they fit naturally. Keep the tone conversational and modern.';

        try {
          let responseText = '';
          if (geminiApiKey.trim()) {
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${geminiApiKey.trim()}`;
            const sysInstruction = `You are FictionFlix AI. Active Agent Mode: ${agentMode}. ${languageInstruction}`;
            const payload = {
              contents: [{ parts: [{ text: `Current chapter draft:\n${currentChapter.content}\n\nUser instruction (${agentMode} mode): ${currentPrompt}` }] }],
              systemInstruction: { parts: [{ text: sysInstruction }] }
            };
            const res = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const data = await res.json();
            responseText = data.candidates?.[0]?.content?.parts?.[0]?.text || 'API Error';
          } else {
            await new Promise(r => setTimeout(r, 1100));
            if (agentMode === 'Co-Writer') {
              if (writingLanguage === 'English') {
                responseText = `[Co-Writer AI suggestion]:\nThe corridor went silent for a moment as the old manuscript trembled in the cold air, and the hidden doorway slowly began to open...`;
              } else if (writingLanguage === 'Hindi') {
                responseText = `[Co-Writer AI सुझाव]:\nउस समय गलियारा अचानक बिल्कुल शांत हो गया, जैसे पुरानी पांडुलिपि ठंडी हवा में कांप रही हो, और छिपा दरवाज़ा धीरे-धीरे खुलने लगा...`;
              } else {
                responseText = `[Co-Writer AI suggestion]:\nअचानक corridor का silence ho gaya, aur पुरानी manuscript ठंडी हवा में कांपने लगी, जैसे hidden door धीरे-धीरे open होने वाला हो...`;
              }
            } else if (agentMode === 'Outliner') {
              if (writingLanguage === 'English') {
                responseText = `[Outliner Plan]:\n1. Reveal the hidden map and identify the forgotten chamber.\n2. Show the first clue hidden behind the cracked wall.\n3. Introduce a sudden sound from the basement entrance.`;
              } else if (writingLanguage === 'Hindi') {
                responseText = `[अध्याय आउटलाइन]:\n1. छिपा नक्शा दिखाकर भूली हुई कोठरी का पता लगाएं।\n2. दरारदार दीवार के पीछे पहला सुराग दिखाएं।\n3. तहखाने के द्वार से अचानक आवाज़ सुनाई दे।`;
              } else {
                responseText = `[Outliner Plan]:\n1. Hidden map reveal karke forgotten chamber ka clue dhoondo.\n2. Cracked wall ke peeche first clue reveal karo.\n3. Basement entrance se sudden sound trigger karo, aur suspense badao.`;
              }
            } else {
              if (writingLanguage === 'English') {
                responseText = `[Polisher Enhancement]:\nThe ancient hall stood still beneath the moonlight, while the shadows around the door seemed to breathe with a life of their own.`;
              } else if (writingLanguage === 'Hindi') {
                responseText = `[शैली परिष्करण]:\nचाँद की रोशनी में प्राचीन大厅 स्थिर खड़ा था, जबकि दरवाज़े के आसपास के अँधेरे में जैसे किसी जीवंत साँस की हलचल आ रही हो।`;
              } else {
                responseText = `[Polisher Enhancement]:\nThe ancient hall stood still under moonlight, aur shadows around the door seem to breathe with their own eerie life, like the whole place is holding its breath.`;
              }
            }
          }

          setChatMessages(prev => [...prev, { id: Date.now() + 1, sender: 'agent', mode: agentMode, text: responseText }]);
        } catch (err) {
          setChatMessages(prev => [...prev, { id: Date.now() + 1, sender: 'agent', mode: agentMode, text: `त्रुटि: AI सेवा कनेक्ट नहीं हो सकी।` }]);
        } finally {
          setIsGenerating(false);
        }
      };

      const getStoryToolLanguageInstruction = () => writingLanguage === 'English'
        ? 'Respond in English.'
        : writingLanguage === 'Hindi'
          ? 'Respond in natural Hindi.'
          : 'Respond in natural Hinglish, mixing Hindi and English smoothly.';

      const requestStoryToolAI = async (instruction, prompt) => {
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${geminiApiKey.trim()}`;
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            systemInstruction: { parts: [{ text: `${instruction} ${getStoryToolLanguageInstruction()} Ground every suggestion in the supplied story and clearly label invented ideas.` }] }
          })
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error?.message || `AI service returned status ${response.status}.`);
        }
        const result = data.candidates?.[0]?.content?.parts?.map(part => part.text || '').join('').trim();
        if (!result) throw new Error('AI service returned an empty response.');
        return result;
      };

      const getLocalStoryToolResult = (toolKey, prompt) => {
        const paragraphs = currentChapter.content.split(/\n\s*\n/).map(text => text.trim()).filter(Boolean);
        const words = currentChapter.content.trim().split(/\s+/).filter(Boolean);
        const chapterWords = chapters.map(ch => ({
          chapter: ch,
          words: ch.content.trim().split(/\s+/).filter(Boolean).length
        }));

        if (toolKey === 'continuity') {
          const characterReport = characterNotes.map(note => {
            const mentionedIn = chapters.filter(ch => ch.content.includes(note.name)).map(ch => ch.number);
            return `${note.name}: ${mentionedIn.length ? `अध्याय ${mentionedIn.join(', ')}` : 'किसी अध्याय में उल्लेख नहीं मिला'}`;
          });
          const issues = chapters.filter(ch => !ch.content.trim() || ch.title.includes('नया अध्याय'));
          return `STORY CONTINUITY REPORT\n\n${characterReport.join('\n') || 'Story Bible में पात्र दर्ज नहीं हैं।'}\n\nजाँच:\n${issues.length ? issues.map(ch => `${ch.number}: ${!ch.content.trim() ? 'अध्याय खाली है।' : 'शीर्षक अभी अस्थायी है।'}`).join('\n') : 'कोई खाली या अस्थायी शीर्षक वाला अध्याय नहीं मिला।'}\n\nयह स्वचालित text-match जाँच है; अर्थ-संबंधी विरोधाभासों को manually verify करें।`;
        }

        if (toolKey === 'hook') {
          const ending = paragraphs[paragraphs.length - 1] || currentChapter.content;
          const excerpt = ending.length > 180 ? `${ending.slice(-180)}...` : ending;
          return `HOOK & CLIFFHANGER IDEAS\n\nमौजूदा ending:\n“${excerpt}”\n\n1. छिपे हुए संकेत को अचानक बदलें—मौजूदा रहस्य से जुड़ी ऐसी चीज़ सामने आए जो पात्र की धारणा को उलट दे।\n2. किसी पात्र को ऐसा निर्णय लेने दें जिसकी कीमत अगले अध्याय में चुकानी पड़े।\n3. अध्याय को नए सवाल या अप्रत्याशित दस्तक पर रोकें; जवाब अगले अध्याय के लिए बचाकर रखें।`;
        }

        if (toolKey === 'whatIf') {
          return `WHAT IF? — वैकल्पिक कहानी दिशाएँ\n\nPremise: ${prompt || 'मुख्य पात्र को कहानी के सबसे महत्वपूर्ण रहस्य का उल्टा सच पता चलता है।'}\n\n1. अगर मुख्य सुराग गलत निकले, तो पात्र किस पर भरोसा करेगा?\n2. अगर विरोधी पात्र को वही जानकारी पहले मिल जाए, तो अगला संघर्ष कैसे बदलेगा?\n3. अगर कहानी का कोई अहम निर्णय उलट दिया जाए, तो किस रिश्ते या रहस्य पर सबसे बड़ा असर पड़ेगा?\n\nहर विकल्प को कहानी की स्थापित continuity से मिलाकर चुनें।`;
        }

        if (toolKey === 'script') {
          return paragraphs.map((paragraph, index) => scriptFormat === 'audio'
            ? `दृश्य ${index + 1} — ${currentChapter.title}\nध्वनि: वातावरण और दृश्य के अनुरूप हल्का रहस्यमय संगीत।\nवाचक: ${paragraph}`
            : `दृश्य ${index + 1} — INT./EXT. ${currentChapter.title.toUpperCase()} — दिन/रात\n${paragraph}\n[क्रिया और संवाद को शूटिंग से पहले अलग-अलग करें.]`
          ).join('\n\n');
        }

        if (toolKey === 'dna') {
          const dialogueMarks = (currentChapter.content.match(/[“”"‘’]/g) || []).length;
          const characterMentions = characterNotes.map(note =>
            `${note.name}: ${(currentChapter.content.match(new RegExp(note.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g')) || []).length}`
          );
          return `STORY DNA ANALYSIS\n\nकिताब: ${chapters.length} अध्याय · ${chapterWords.reduce((sum, item) => sum + item.words, 0)} शब्द\nवर्तमान अध्याय: ${currentChapter.title}\nशब्द: ${words.length} · पैराग्राफ: ${paragraphs.length} · संवाद चिह्न: ${dialogueMarks}\n\nपात्र उल्लेख:\n${characterMentions.join('\n') || 'Story Bible में पात्र दर्ज नहीं हैं।'}\n\nयह माप text structure और दर्ज पात्रों पर आधारित है; suspense, plot और emotion की गहरी व्याख्या के लिए Gemini API key जोड़ें।`;
        }

        if (toolKey === 'storyforge') {
          if (!prompt.trim()) throw new Error('पहले कहानी का idea लिखें।');
          return `STORYFORGE — IDEA से कहानी की रूपरेखा\n\nIdea: ${prompt.trim()}\n\nLogline: एक पात्र को इस विचार से जुड़ा ऐसा सच मिलता है जो उसकी सबसे जरूरी इच्छा को खतरे में डालता है।\n\nशुरुआत: मुख्य पात्र, उसकी इच्छा और पहली बाधा दिखाएँ।\nमध्य: सुरागों और फैसलों से दांव बढ़ाएँ; हर खुलासा अगले सवाल को जन्म दे।\nचरम बिंदु: पात्र को ऐसी कीमत वाला निर्णय लेना पड़े जो कहानी के मूल विचार से जुड़ा हो।\nअंत: निर्णय का परिणाम दिखाएँ और एक भावनात्मक सवाल का जवाब दें।\n\nयह शुरुआती ढाँचा है—पात्रों और setting को अपने विचार के अनुसार भरें।`;
        }

        if (toolKey === 'xray') {
          const longParagraphs = paragraphs.filter(paragraph => paragraph.split(/\s+/).length > 120).length;
          const dialogueMarks = (currentChapter.content.match(/[“”"‘’]/g) || []).length;
          const repeatedWords = words
            .map(word => word.toLocaleLowerCase().replace(/[^\p{L}\p{N}]/gu, ''))
            .filter(word => word.length > 4)
            .reduce((counts, word) => ({ ...counts, [word]: (counts[word] || 0) + 1 }), {});
          const repetitions = Object.entries(repeatedWords).filter(([, count]) => count > 2).sort((a, b) => b[1] - a[1]).slice(0, 5);
          return `NARRATIVE X-RAY — ${currentChapter.title}\n\nशब्द: ${words.length} · पैराग्राफ: ${paragraphs.length} · संवाद चिह्न: ${dialogueMarks}\n120+ शब्द वाले पैराग्राफ: ${longParagraphs}\nबार-बार आए शब्द: ${repetitions.length ? repetitions.map(([word, count]) => `${word} (${count})`).join(', ') : 'कोई स्पष्ट दोहराव नहीं मिला'}\n\nसंभावित सुधार:\n${longParagraphs ? '• लंबे पैराग्राफ में action या भावनात्मक बदलाव के बिंदु पर break जाँचें।' : '• पैराग्राफ की लंबाई संतुलित दिखती है।'}\n${dialogueMarks < 2 ? '• पात्रों की आवाज़ दिखाने के लिए संवाद जोड़ने की गुंजाइश जाँचें।' : '• संवाद की मात्रा मौजूद है—हर संवाद का उद्देश्य जाँचें।'}\n• अगले अध्याय के लक्ष्य और मौजूदा ending के बीच कारण-परिणाम स्पष्ट रखें।`;
        }

        return '';
      };

      const handleRunStoryTool = async () => {
        if (isStoryToolRunning) return;
        setIsStoryToolRunning(true);
        setStoryToolResult('');
        try {
          const toolInstructions = {
            continuity: 'Review all supplied chapters for continuity issues: character facts, chronology, dangling events, and inconsistencies. Separate evidence from assumptions.',
            hook: 'Suggest three distinct opening hooks or chapter cliffhangers.',
            whatIf: 'Explore three distinct what-if plot branches and describe their consequences.',
            script: `Adapt the supplied chapter into a ${scriptFormat === 'audio' ? 'narrated audio script with sound cues' : 'visual video screenplay with scene headings and action'}.`,
            dna: 'Analyze the supplied story DNA: suspense, plot progression, emotional movement, character roles, and recurring motifs. Cite evidence and avoid unsupported claims.',
            storyforge: 'Develop the user idea into an engaging logline, key characters, conflict, and a concise three-act story outline.',
            xray: 'Find narrative weaknesses and missed opportunities in the supplied story. Compare chapter pacing, cite evidence, and suggest concrete improvements.'
          };
          if (activeStoryTool === 'storyforge' && !storyToolPrompt.trim()) {
            throw new Error('पहले कहानी का idea लिखें।');
          }
          const storyText = activeStoryTool === 'continuity' || activeStoryTool === 'dna' || activeStoryTool === 'xray'
            ? chapters.map(ch => `${ch.number} — ${ch.title}\n${ch.content}`).join('\n\n')
            : `${currentChapter.title}\n${currentChapter.content}`;
          const prompt = `${toolInstructions[activeStoryTool]}\n\nUser direction: ${storyToolPrompt || 'Use your judgment.'}\n\nStory chapters:\n${storyText}\n\nStory Bible characters: ${characterNotes.map(note => `${note.name} (${note.role}): ${note.desc}`).join('\n')}\nStory lore: ${worldLore.map(lore => `${lore.title}: ${lore.detail}`).join('\n')}`;
          const aiTools = Object.keys(toolInstructions);
          const result = geminiApiKey.trim() && aiTools.includes(activeStoryTool)
            ? await requestStoryToolAI(toolInstructions[activeStoryTool], prompt)
            : getLocalStoryToolResult(activeStoryTool, storyToolPrompt);
          setStoryToolResult(result);
          if (!geminiApiKey.trim() && aiTools.includes(activeStoryTool)) {
            triggerToast('Local fallback से सुझाव तैयार हुए। Gemini API key जोड़ें विस्तृत AI के लिए।', 'fa-circle-info');
          } else {
            triggerToast('Story tool analysis पूरा हुआ!', 'fa-check-double');
          }
        } catch (error) {
          console.error('Unable to run story tool:', error);
          setStoryToolResult(`यह tool पूरा नहीं हो सका: ${error.message}`);
          triggerToast('Story tool चल नहीं सका। विवरण परिणाम में देखें।', 'fa-triangle-exclamation');
        } finally {
          setIsStoryToolRunning(false);
        }
      };

      const handleSaveStoryVersion = () => {
        const nextVersions = [{
          id: Date.now(),
          savedAt: new Date().toISOString(),
          chapters: JSON.parse(JSON.stringify(chapters))
        }, ...storyVersions];
        try {
          localStorage.setItem('fictionflix-story-versions', JSON.stringify(nextVersions));
          setStoryVersions(nextVersions);
          triggerToast('Story version सुरक्षित हो गया!', 'fa-clock-rotate-left');
        } catch (error) {
          console.error('Unable to save story version:', error);
          triggerToast('Version save नहीं हुआ। Browser storage में जगह जाँचें।', 'fa-triangle-exclamation');
        }
      };

      const handleRestoreStoryVersion = (version) => {
        if (!version.chapters.length) {
          triggerToast('इस version में restore करने योग्य chapter नहीं हैं।', 'fa-triangle-exclamation');
          return;
        }
        setChapters(version.chapters);
        setActiveChapterId(version.chapters[0].id);
        triggerToast('Story version restore हुआ।', 'fa-clock-rotate-left');
      };

      const updateContent = (newText) => {
        setChapters(prev => prev.map(ch => ch.id === activeChapterId ? { ...ch, content: newText } : ch));
      };

      const handleAddNewChapter = () => {
        const newId = chapters.length + 1;
        const newChap = {
          id: newId,
          number: `०${newId}`,
          title: `अध्याय ${newId}: नया अध्याय`,
          isBookmarked: false,
          image: null,
          imageAlign: 'center',
          imageScale: 100,
          content: `यहाँ से अध्याय ${newId} लिखना प्रारंभ करें...`
        };
        setChapters([...chapters, newChap]);
        setActiveChapterId(newId);
        triggerToast(`नया अध्याय ${newId} जोड़ा गया!`, 'fa-plus');
      };

      const wordsCount = currentChapter.content.trim().split(/\s+/).filter(Boolean).length;
      const charCount = currentChapter.content.length;
      const storyToolOptions = [
        { id: 'continuity', title: 'Story Continuity Checker', icon: 'fa-shield-halved', description: 'पात्रों और घटनाओं की continuity में छूटे संदर्भ जाँचें।' },
        { id: 'hook', title: 'Hook & Cliffhanger Tool', icon: 'fa-bolt', description: 'शुरुआत या ending को रोचक बनाने के सुझाव पाएँ।' },
        { id: 'whatIf', title: 'What If Story Tool', icon: 'fa-code-branch', description: 'कहानी के वैकल्पिक रास्ते और उनके नतीजे खोजें।' },
        { id: 'vault', title: 'Story Knowledge Vault', icon: 'fa-box-archive', description: 'पात्रों, दुनिया और पुराने episodes के facts खोजें।' },
        { id: 'script', title: 'Book to Audio/Video Script', icon: 'fa-clapperboard', description: 'अध्याय को narration या video screenplay में ढालें।' },
        { id: 'versions', title: 'Version History', icon: 'fa-clock-rotate-left', description: 'कहानी के snapshots save और restore करें।' },
        { id: 'dna', title: 'Story DNA Analyzer', icon: 'fa-dna', description: 'कहानी के structure, पात्र और शैली के संकेत पढ़ें।' },
        { id: 'storyforge', title: 'StoryForge AI', icon: 'fa-wand-magic-sparkles', description: 'एक idea से कहानी की रूपरेखा तैयार करें।' },
        { id: 'xray', title: 'Narrative X-Ray', icon: 'fa-magnifying-glass-chart', description: 'कमज़ोरियों, दोहराव और सुधार के अवसर खोजें।' }
      ];

                          if (!newNoteName.trim()) return;
                          const nextCharacter = {
                            id: `${Date.now()}-${Math.random().toString(36).slice(2)}`,
                            name: newNoteName.trim(),
                            role: newNoteRole.trim() || 'पात्र',
                            desc: newNoteDesc.trim()
                          };
                          setCharacterNotes(prev => [...prev, nextCharacter]);
                          setNewNoteName('');
                          setNewNoteRole('');
                          setNewNoteDesc('');
                          triggerToast('नया पात्र जोड़ा गया!', 'fa-user-plus');
                        }}
                        className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3 py-1.5 rounded-lg text-xs transition-all">
                        + जोड़ें
                      </button>
                    </div>
                  </div>
                </div>

                <div>
                  <h4 className="font-bold text-brand-yellow text-xs mb-3">वर्ल्ड लोर (World Lore):</h4>
                  <div className="space-y-2 mb-3">
                    {worldLore.map(l => (
                      <div key={l.id} className="bg-brand-panel p-3 rounded-xl border border-brand-border flex justify-between items-center text-xs">
                        <div><strong className="text-white">{l.title}</strong>: {l.detail}</div>
                        <button onClick={() => setWorldLore(prev => prev.filter(x => x.id !== l.id))} className="text-brand-red hover:underline">हटाएं</button>
                      </div>
                    ))}
                  </div>

                  <div className="bg-brand-darker p-3 rounded-xl border border-brand-border space-y-2">
                    <span className="text-[11px] font-bold text-slate-300 block">+ नया वर्ल्ड लोर जोड़ें:</span>
                    <div className="flex gap-2">
                      <input 
                        type="text" 
                        value={newLoreTitle} 
                        onChange={e => setNewLoreTitle(e.target.value)} 
                        placeholder="शीर्षक..." 
                        className="w-1/3 bg-brand-black border border-brand-border rounded-lg px-2.5 py-1.5 text-xs text-white outline-none"
                      />
                      <input 
                        type="text" 
                        value={newLoreDetail} 
                        onChange={e => setNewLoreDetail(e.target.value)} 
                        placeholder="लोर विवरण..." 
                        className="flex-1 bg-brand-black border border-brand-border rounded-lg px-2.5 py-1.5 text-xs text-white outline-none"
                      />
                      <button 
                        onClick={() => {
                          if (!newLoreTitle.trim()) return;
                          const nextLore = {
                            id: `${Date.now()}-${Math.random().toString(36).slice(2)}`,
                            title: newLoreTitle.trim(),
                            detail: newLoreDetail.trim()
                          };
                          setWorldLore(prev => [...prev, nextLore]);
                          setNewLoreTitle('');
                          setNewLoreDetail('');
                          triggerToast('नया वर्ल्ड लोर जोड़ा गया!', 'fa-plus');
                        }}
                        className="bg-brand-yellow/20 hover:bg-brand-yellow text-brand-yellow hover:text-brand-black border border-brand-yellow font-bold px-3 py-1.5 rounded-lg text-xs transition-all">
                        + जोड़ें
                      </button>
                    </div>
                  </div>
                </div>

              </div>
            </div>
          )}

          {showTranslateModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md layer-modal flex items-center justify-center p-4">
              <div className="bg-brand-card border border-brand-border rounded-3xl w-full max-w-md p-6 shadow-2xl">
                <div className="flex items-center justify-between border-b border-brand-border pb-4 mb-4">
                  <h3 className="text-base font-bold text-white flex items-center gap-2">
                    <i className="fa-solid fa-language text-brand-yellow"></i> Whole Book Translation
                  </h3>
                  <button onClick={() => setShowTranslateModal(false)} className="text-slate-400"><i className="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <div className="grid grid-cols-2 gap-2 text-xs">
                  {['English', 'Hindi', 'Spanish', 'French'].map((lang) => (
                    <button key={lang} onClick={() => handleTranslateBook(lang)} className="p-3 bg-brand-panel border border-brand-border hover:border-brand-yellow rounded-xl font-bold text-white text-center">
                      {lang}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {showStoryTools && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md layer-modal flex items-center justify-center p-2 sm:p-5">
              <section className="flex h-[94vh] w-full max-w-6xl flex-col overflow-hidden rounded-3xl border border-brand-border bg-brand-card shadow-2xl" aria-label="Story Tools">
                <header className="flex shrink-0 items-center justify-between gap-3 border-b border-brand-border bg-brand-darker px-4 py-3 sm:px-6">
                  <div>
                    <h2 className="text-base font-extrabold text-white sm:text-lg"><i className="fa-solid fa-book-open text-brand-yellow mr-2"></i>Story Tools</h2>
                    <p className="mt-1 text-[10px] text-slate-400">किसी feature को चुनें — मौजूदा chapters और Story Bible सुरक्षित रहेंगे।</p>
                  </div>
                  <button onClick={() => setShowStoryTools(false)} aria-label="Close Story Tools" className="rounded-lg border border-brand-border bg-brand-panel px-3 py-2 text-slate-300 hover:border-brand-red hover:text-white">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </header>

                <div className="shrink-0 overflow-x-auto border-b border-brand-border p-3">
                  <div className="grid min-w-[720px] grid-cols-9 gap-2">
                    {storyToolOptions.map(tool => (
                      <button
                        key={tool.id}
                        onClick={() => { setActiveStoryTool(tool.id); setStoryToolResult(''); setStoryToolPrompt(''); }}
                        aria-pressed={activeStoryTool === tool.id}
                        className={`flex min-h-20 flex-col items-center justify-center gap-2 rounded-xl border p-2 text-center transition ${
                          activeStoryTool === tool.id
                            ? 'border-brand-yellow bg-brand-yellow/10 text-brand-yellow'
                            : 'border-brand-border bg-brand-panel text-slate-300 hover:border-brand-red hover:text-white'
                        }`}>
                        <i className={`fa-solid ${tool.icon} text-sm`}></i>
                        <span className="text-[9px] font-bold leading-tight">{tool.title}</span>
                      </button>
                    ))}
                  </div>
                </div>

                <div className="flex-1 overflow-y-auto p-4 sm:p-6">
                  {storyToolOptions.filter(tool => tool.id === activeStoryTool).map(tool => (
                    <div key={tool.id} className="mx-auto max-w-4xl">
                      <h3 className="text-lg font-extrabold text-white">{tool.title}</h3>
                      <p className="mt-1 text-xs text-slate-400">{tool.description}</p>

                      {activeStoryTool === 'vault' ? (
                        <div className="mt-5 space-y-4">
                          <div className="flex flex-wrap items-center gap-2">
                            <input
                              type="search"
                              value={storyToolSearch}
                              onChange={event => setStoryToolSearch(event.target.value)}
                              placeholder="पात्र, जगह या पुराने episode का fact खोजें..."
                              className="min-w-0 flex-1 rounded-xl border border-brand-border bg-brand-black px-3 py-2.5 text-xs text-white outline-none focus:border-brand-yellow"
                            />
                            <button onClick={() => { setShowStoryTools(false); setShowNotesModal(true); }} className="rounded-xl border border-brand-border bg-brand-panel px-3 py-2.5 text-[10px] font-bold text-white hover:border-brand-yellow">
                              Story Bible खोलें
                            </button>
                          </div>
                          <div className="grid gap-4 md:grid-cols-2">
                            <div className="rounded-2xl border border-brand-border bg-brand-panel p-4">
                              <h4 className="mb-3 text-xs font-extrabold uppercase tracking-wider text-emerald-400">पात्र और वस्तुएँ</h4>
                              <div className="space-y-2">
                                {characterNotes.filter(note => `${note.name} ${note.role} ${note.desc}`.toLocaleLowerCase().includes(storyToolSearch.toLocaleLowerCase())).map(note => (
                                  <article key={note.id} className="rounded-xl border border-brand-border bg-brand-card p-3">
                                    <div className="text-xs font-bold text-white">{note.name} <span className="text-[10px] font-normal text-brand-yellow">· {note.role}</span></div>
                                    <p className="mt-1 text-[11px] leading-relaxed text-slate-400">{note.desc || 'कोई अतिरिक्त विवरण नहीं।'}</p>
                                  </article>
                                ))}
                                {!characterNotes.some(note => `${note.name} ${note.role} ${note.desc}`.toLocaleLowerCase().includes(storyToolSearch.toLocaleLowerCase())) && <p className="text-xs text-slate-500">कोई matching पात्र नहीं मिला।</p>}
                              </div>
                            </div>
                            <div className="rounded-2xl border border-brand-border bg-brand-panel p-4">
                              <h4 className="mb-3 text-xs font-extrabold uppercase tracking-wider text-brand-yellow">दुनिया और पुराने facts</h4>
                              <div className="space-y-2">
                                {worldLore.filter(lore => `${lore.title} ${lore.detail}`.toLocaleLowerCase().includes(storyToolSearch.toLocaleLowerCase())).map(lore => (
                                  <article key={lore.id} className="rounded-xl border border-brand-border bg-brand-card p-3">
                                    <div className="text-xs font-bold text-white">{lore.title}</div>
                                    <p className="mt-1 text-[11px] leading-relaxed text-slate-400">{lore.detail || 'कोई अतिरिक्त विवरण नहीं।'}</p>
                                  </article>
                                ))}
                                {!worldLore.some(lore => `${lore.title} ${lore.detail}`.toLocaleLowerCase().includes(storyToolSearch.toLocaleLowerCase())) && <p className="text-xs text-slate-500">कोई matching lore नहीं मिला।</p>}
                              </div>
                            </div>
                          </div>
                          <div className="rounded-2xl border border-brand-border bg-brand-panel p-4">
                            <h4 className="mb-3 text-xs font-extrabold uppercase tracking-wider text-brand-red">पुराने Episodes और अध्याय</h4>
                            <div className="space-y-2">
                              {chapters.filter(ch => `${ch.number} ${ch.title} ${ch.content}`.toLocaleLowerCase().includes(storyToolSearch.toLocaleLowerCase())).map(ch => (
                                <article key={ch.id} className="flex flex-wrap items-start justify-between gap-3 rounded-xl border border-brand-border bg-brand-card p-3">
                                  <div className="min-w-0 flex-1">
                                    <div className="text-xs font-bold text-white">{ch.number} · {ch.title}</div>
                                    <p className="mt-1 text-[11px] leading-relaxed text-slate-400">{ch.content.slice(0, 240)}{ch.content.length > 240 ? '…' : ''}</p>
                                  </div>
                                  <button onClick={() => { setActiveChapterId(ch.id); setShowStoryTools(false); }} className="rounded-lg border border-brand-border bg-brand-panel px-3 py-2 text-[10px] font-bold text-slate-200 hover:border-brand-yellow hover:text-brand-yellow">
                                    अध्याय खोलें
                                  </button>
                                </article>
                              ))}
                              {!chapters.some(ch => `${ch.number} ${ch.title} ${ch.content}`.toLocaleLowerCase().includes(storyToolSearch.toLocaleLowerCase())) && <p className="text-xs text-slate-500">कोई matching पुराना अध्याय नहीं मिला।</p>}
                            </div>
                          </div>
                        </div>
                      ) : activeStoryTool === 'versions' ? (
                        <div className="mt-5 space-y-4">
                          <div className="flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-brand-border bg-brand-panel p-4">
                            <div>
                              <div className="text-xs font-bold text-white">मौजूदा किताब का snapshot</div>
                              <p className="mt-1 text-[10px] text-slate-400">{chapters.length} अध्याय · Browser में local रूप से सुरक्षित</p>
                            </div>
                            <button onClick={handleSaveStoryVersion} className="rounded-xl bg-brand-yellow px-4 py-2.5 text-xs font-extrabold text-brand-black hover:bg-brand-yellowLight">
                              <i className="fa-solid fa-floppy-disk mr-2"></i>वर्तमान version save करें
                            </button>
                          </div>
                          <div className="space-y-2">
                            {storyVersions.map((version, index) => (
                              <article key={version.id} className="flex flex-wrap items-center justify-between gap-3 rounded-xl border border-brand-border bg-brand-panel p-3">
                                <div>
                                  <div className="text-xs font-bold text-white">Version {storyVersions.length - index} · {version.chapters.length} अध्याय</div>
                                  <div className="mt-1 text-[10px] text-slate-400">{new Date(version.savedAt).toLocaleString()}</div>
                                </div>
                                <button onClick={() => handleRestoreStoryVersion(version)} className="rounded-lg border border-brand-border bg-brand-card px-3 py-2 text-[10px] font-bold text-slate-200 hover:border-brand-yellow hover:text-brand-yellow">
                                  Restore version
                                </button>
                              </article>
                            ))}
                            {!storyVersions.length && <div className="rounded-xl border border-dashed border-brand-border p-6 text-center text-xs text-slate-500">अभी कोई saved version नहीं है। Restore करने से पहले एक version save करें।</div>}
                          </div>
                        </div>
                      ) : (
                        <div className="mt-5 space-y-4">
                          {(activeStoryTool === 'whatIf' || activeStoryTool === 'storyforge' || activeStoryTool === 'hook') && (
                            <textarea
                              value={storyToolPrompt}
                              onChange={event => setStoryToolPrompt(event.target.value)}
                              placeholder={activeStoryTool === 'storyforge' ? 'अपना कहानी idea यहाँ लिखें...' : activeStoryTool === 'whatIf' ? 'कहानी में कौन-सा बदलाव explore करें? (वैकल्पिक)' : 'Hook या cliffhanger के लिए कोई खास दिशा? (वैकल्पिक)'}
                              rows={3}
                              className="w-full resize-y rounded-xl border border-brand-border bg-brand-black p-3 text-xs leading-relaxed text-white outline-none focus:border-brand-yellow"
                            />
                          )}

                          {activeStoryTool === 'script' && (
                            <div className="flex flex-wrap items-center gap-2">
                              <span className="text-[10px] font-bold uppercase tracking-wide text-slate-400">Script type</span>
                              <button onClick={() => { setScriptFormat('audio'); setStoryToolResult(''); }} className={`rounded-lg border px-3 py-2 text-[10px] font-bold ${scriptFormat === 'audio' ? 'border-brand-yellow bg-brand-yellow/10 text-brand-yellow' : 'border-brand-border bg-brand-panel text-slate-300'}`}>Audio narration</button>
                              <button onClick={() => { setScriptFormat('video'); setStoryToolResult(''); }} className={`rounded-lg border px-3 py-2 text-[10px] font-bold ${scriptFormat === 'video' ? 'border-brand-yellow bg-brand-yellow/10 text-brand-yellow' : 'border-brand-border bg-brand-panel text-slate-300'}`}>Video screenplay</button>
                            </div>
                          )}

                          <div className="flex flex-wrap items-center gap-3">
                            <button onClick={handleRunStoryTool} disabled={isStoryToolRunning} className="rounded-xl bg-brand-red px-4 py-2.5 text-xs font-extrabold text-white transition hover:bg-brand-redDark disabled:cursor-wait disabled:opacity-60">
                              <i className={`fa-solid ${isStoryToolRunning ? 'fa-spinner fa-spin' : 'fa-wand-magic-sparkles'} mr-2`}></i>
                              {isStoryToolRunning ? 'काम हो रहा है...' : ['continuity', 'dna', 'xray'].includes(activeStoryTool) ? 'Analysis चलाएँ' : 'Suggestion तैयार करें'}
                            </button>
                            {['continuity', 'dna', 'xray'].includes(activeStoryTool) && <span className="text-[10px] text-slate-500">{geminiApiKey.trim() ? 'Gemini AI · पूरी कहानी का analysis' : 'स्थानीय chapter analysis · API key की आवश्यकता नहीं'}</span>}
                            {!['continuity', 'dna', 'xray'].includes(activeStoryTool) && <span className="text-[10px] text-slate-500">{geminiApiKey.trim() ? 'Gemini AI connected' : 'Gemini key न होने पर local fallback'}</span>}
                          </div>

                          {activeStoryTool === 'xray' && storyToolResult && (
                            <div className="rounded-2xl border border-brand-border bg-brand-panel p-4">
                              <h4 className="mb-3 text-[10px] font-extrabold uppercase tracking-wider text-brand-yellow">अध्याय तुलना · शब्द</h4>
                              <div className="space-y-2">
                                {chapters.map(ch => {
                                  const chapterWordCount = ch.content.trim().split(/\s+/).filter(Boolean).length;
                                  const maxWords = Math.max(...chapters.map(item => item.content.trim().split(/\s+/).filter(Boolean).length), 1);
                                  return (
                                    <div key={ch.id} className="grid grid-cols-[minmax(90px,160px)_1fr_40px] items-center gap-2 text-[10px]">
                                      <span className="truncate text-slate-300">{ch.title}</span>
                                      <div className="h-2 overflow-hidden rounded-full bg-brand-black"><div className="h-full rounded-full bg-brand-red" style={{ width: `${Math.max(2, chapterWordCount / maxWords * 100)}%` }}></div></div>
                                      <span className="text-right tabular-nums text-slate-400">{chapterWordCount}</span>
                                    </div>
                                  );
                                })}
                              </div>
                            </div>
                          )}

                          {storyToolResult && <pre className="max-h-[42vh] overflow-auto whitespace-pre-wrap rounded-2xl border border-brand-border bg-brand-panel p-4 text-xs leading-relaxed text-slate-200">{storyToolResult}</pre>}
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </section>
            </div>
          )}

        </div>
      );
    }

    const mountApp = () => {
      try {
        const rootEl = document.getElementById('root');
        if (rootEl) ReactDOM.createRoot(rootEl).render(<FictionFlixStudio />);
      } catch (err) { console.error(err); }
    };
    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', mountApp); } else { mountApp(); }
  </script>
</body>
</html>
