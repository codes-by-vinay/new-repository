<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FictionFlix - Ultra Premium AI Book Studio</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js" crossorigin></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Rozha+One&display=swap" rel="stylesheet">

  <script>
    window.tailwind = window.tailwind || {};
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              black: '#0A0A0C',
              darker: '#121217',
              card: '#181820',
              panel: '#20202B',
              border: '#2E2E3E',
              red: '#FF4D4D',
              redDark: '#D63030',
              yellow: '#FFB703',
              yellowLight: '#FFE8A3',
              paper: '#FAF7F2',
              sepia: '#F4ECD8'
            }
          },
          fontFamily: {
            title: ['Cinzel', 'serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            serif: ['Merriweather', 'serif'],
            rozha: ['Rozha One', 'serif']
          }
        }
      }
    };
  </script>

  <style>
    body {
      background-color: #0A0A0C;
      color: #E2E8F0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    .no-copy {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    .bleed-guide { border: 1.5px dashed #FF4D4D; }
    .safe-guide { border: 1.5px dashed #FFB703; }
    .baseline-grid {
      background-size: 100% 24px;
      background-image: linear-gradient(to bottom, rgba(255, 183, 3, 0.08) 1px, transparent 1px);
    }
    .visual-paragraphing textarea {
      text-indent: 2em;
      line-height: 2;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #121217; }
    ::-webkit-scrollbar-thumb { background: #2E2E3E; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #FF4D4D; }
    @media print { body { display: none !important; } }
  </style>
</head>
<body class="bg-[#0A0A0C] text-slate-200 antialiased min-h-screen no-copy">
  
  <div id="root">
    <div class="h-screen w-screen flex flex-col items-center justify-center bg-[#0A0A0C] text-slate-300 gap-4">
      <div class="w-12 h-12 border-4 border-brand-red border-t-transparent rounded-full animate-spin"></div>
      <div class="font-title text-lg font-bold text-white tracking-widest">FICTION<span class="text-brand-red">FLIX</span> STUDIO</div>
      <p class="text-xs text-slate-500">AI बुक स्टूडियो लोड हो रहा है...</p>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function FictionFlixStudio() {
      const [chapters, setChapters] = useState([
        {
          id: 1,
          number: '०१',
          title: 'अध्याय १: अंधेरे की सुगबुगाहट',
          isBookmarked: false,
          image: null,
          imageAlign: 'center',
          imageScale: 100,
          content: `रात के बारह बज रहे थे जब कासगंज की पुरानी हवेली का मुख्य दरवाजा तेज हवा के झोंके से खड़खड़ा उठा। देवव्रत ने अपनी पुरानी लाल डायरी बंद की और मोमबत्ती की मद्धिम लौ की तरफ देखा। पूरे कमरे में फैली रहस्यमयी खामोशी अब किसी अनहोनी घटना का स्पष्ट इशारा दे रही थी...\n\nसामने लकड़ी की पुरानी मेज पर रखे प्राचीन पीतल के यंत्र से अचानक नीली किरणें निकलने लगी थीं। यह वही गुप्त उपकरण था जिसे अठारहवीं सदी के बाद पूरी तरह भुला दिया गया था। देवव्रत ने कांपते हाथों से चश्मा संभाला और कदम आगे बढ़ाए।`
        },
        {
          id: 2,
          number: '०२',
          title: 'अध्याय २: गुप्त तहखाना',
          isBookmarked: true,
          image: null,
          imageAlign: 'center',
          imageScale: 100,
          content: `तहखाने की सीढ़ियों पर जमा धूल इस बात का सबूत थी कि यहाँ दशकों से कोई नहीं आया था। दीवारों पर उकेरी गई अज्ञात भाषा की लिपियाँ मोमबत्ती के प्रकाश में चमक रही थीं।\n\n"क्या यह वही नक्शा है जिसका उल्लेख दादाजी की वसीयत में था?" देवव्रत ने मन ही मन सोचा। तभी पीछे से भारी पत्थर खिसकने की आवाज गूंजी...`
        }
      ]);

      const [activeChapterId, setActiveChapterId] = useState(1);
      const [showGuides, setShowGuides] = useState(true);
      const [showBaselineGrid, setShowBaselineGrid] = useState(false);
      const [showApiModal, setShowApiModal] = useState(false);
      const [showReaderMode, setShowReaderMode] = useState(false);
      const [showExportModal, setShowExportModal] = useState(false);
      const [showGrammarPanel, setShowGrammarPanel] = useState(true);

      const [showLeftDrawer, setShowLeftDrawer] = useState(false);
      const [showRightChatDrawer, setShowRightChatDrawer] = useState(true);

      const [showNotesModal, setShowNotesModal] = useState(false);
      const [showTranslateModal, setShowTranslateModal] = useState(false);
      const [visualParagraphing, setVisualParagraphing] = useState(false);
      const [selectedFont, setSelectedFont] = useState('serif');
      const [fontSize, setFontSize] = useState(16);
      const [textAlign, setTextAlign] = useState('left');
      
      const [characterNotes, setCharacterNotes] = useState([
        { id: 1, name: 'देवव्रत', role: 'मुख्य पात्र', desc: 'रहस्यवादी घटनाओं का अनुसंधान करने वाला युवा लेखक।' },
        { id: 2, name: 'प्राचीन पीतल यंत्र', role: 'रहस्यमयी वस्तु', desc: 'अठारहवीं सदी का गुप्त यंत्र।' }
      ]);
      const [worldLore, setWorldLore] = useState([
        { id: 1, title: 'कासगंज हवेली', detail: 'अठारहवीं शताब्दी की प्राचीन शापित हवेली।' }
      ]);

      const [newNoteName, setNewNoteName] = useState('');
      const [newNoteRole, setNewNoteRole] = useState('');
      const [newNoteDesc, setNewNoteDesc] = useState('');
      const [newLoreTitle, setNewLoreTitle] = useState('');
      const [newLoreDetail, setNewLoreDetail] = useState('');

      const [geminiApiKey, setGeminiApiKey] = useState('');
      const [agentMode, setAgentMode] = useState('Co-Writer');
      const [writingLanguage, setWritingLanguage] = useState('Hinglish');
      const [promptInput, setPromptInput] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);
      const [toastNotice, setToastNotice] = useState(null);

      const [chatMessages, setChatMessages] = useState([
        {
          id: 1,
          sender: 'agent',
          mode: 'Co-Writer',
          text: 'नमस्ते! मैं आपका FictionFlix AI Assistant हूँ। आप Co-Writer, Outliner या Polisher मोड चुनकर निर्देश दे सकते हैं।'
        }
      ]);

      const chatScrollRef = useRef(null);
      const fileInputRef = useRef(null);
      const textareaRef = useRef(null);
      const currentChapter = chapters.find(c => c.id === activeChapterId) || chapters[0];

      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.ctrlKey && (e.key === 's' || e.key === 'p' || e.key === 'c' || e.key === 'u')) || e.key === 'F12' || e.key === 'PrintScreen') {
            e.preventDefault();
            triggerToast('सुरक्षा कारणों से कंटेंट सुरक्षित है!', 'fa-shield-halved');
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      useEffect(() => {
        if (chatScrollRef.current) {
          chatScrollRef.current.scrollTop = chatScrollRef.current.scrollHeight;
        }
      }, [chatMessages, isGenerating]);

      const triggerToast = (msg, icon = 'fa-circle-check') => {
        setToastNotice({ msg, icon });
        setTimeout(() => setToastNotice(null), 3500);
      };

      const handleRemoveChapter = (id) => {
        if (chapters.length <= 1) {
          triggerToast('कम से कम एक अध्याय होना अनिवार्य है!', 'fa-triangle-exclamation');
          return;
        }
        const updated = chapters.filter(c => c.id !== id);
        setChapters(updated);
        setActiveChapterId(updated[0].id);
        triggerToast('अध्याय हटा दिया गया!', 'fa-trash');
      };

      const handleToggleBookmark = (id) => {
        setChapters(prev => prev.map(ch => ch.id === id ? { ...ch, isBookmarked: !ch.isBookmarked } : ch));
        triggerToast('बुकमार्क अपडेट हुआ!', 'fa-bookmark');
      };

      const handleImageUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        e.target.value = '';

        const reader = new FileReader();
        reader.onload = (uploadEvent) => {
          const img = new Image();
          img.onload = () => {
            const maxSide = 1600;
            const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
            const canvas = document.createElement('canvas');
            const width = Math.max(1, Math.round(img.width * scale));
            const height = Math.max(1, Math.round(img.height * scale));
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);

            const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.82);
            setChapters(prev => prev.map(ch => ch.id === activeChapterId ? { ...ch, image: compressedDataUrl, imageScale: 100 } : ch));
            triggerToast('चित्र सफलतापूर्वक जोड़ दिया गया!', 'fa-image');
          };
          img.src = uploadEvent.target.result;
        };
        reader.readAsDataURL(file);
      };

      const handleImagePositionChange = (alignType) => {
        setChapters(prev => prev.map(ch => ch.id === activeChapterId ? { ...ch, imageAlign: alignType } : ch));
        triggerToast(`चित्र की स्थिति (${alignType}) सेट कर दी गई!`, 'fa-arrows-alt');
      };

      const handleImageScaleChange = (delta) => {
        setChapters(prev => prev.map(ch => {
          if (ch.id !== activeChapterId) return ch;
          const nextScale = Math.min(180, Math.max(50, (ch.imageScale || 100) + delta));
          return { ...ch, imageScale: nextScale };
        }));
      };

      const insertTextAtPosition = (textToInsert, mode = 'cursor') => {
        const content = currentChapter.content;
        const textarea = textareaRef.current;

        if (mode === 'cursor' && textarea) {
          const startPos = textarea.selectionStart;
          const endPos = textarea.selectionEnd;
          const newContent = content.substring(0, startPos) + '\n\n' + textToInsert + '\n\n' + content.substring(endPos);
          updateContent(newContent);
          triggerToast('कर्सर की सटीक जगह पर AI टेक्स्ट जोड़ दिया गया!', 'fa-file-circle-plus');
        } else {
          const paragraphs = content.split('\n\n');
          let updatedParagraphs = [...paragraphs];
          if (mode === 'first') {
            updatedParagraphs.splice(1, 0, textToInsert);
          } else if (mode === 'random') {
            const randIdx = Math.floor(Math.random() * paragraphs.length);
            updatedParagraphs.splice(randIdx + 1, 0, textToInsert);
          } else {
            updatedParagraphs.push(textToInsert);
          }
          updateContent(updatedParagraphs.join('\n\n'));
          triggerToast('AI सामग्री उपयुक्त स्थान पर जोड़ दी गई!', 'fa-file-circle-plus');
        }
      };

      const handleTranslateBook = (lang) => {
        triggerToast(`किताब का ${lang} में अनुवाद शुरू हो रहा है...`, 'fa-language');
        setTimeout(() => {
          setShowTranslateModal(false);
          triggerToast(`किताब का ${lang} अनुवाद पूर्ण हुआ!`, 'fa-check-double');
        }, 1500);
      };

      const handleSendMessage = async () => {
        if (!promptInput.trim() || isGenerating) return;
        const userMsg = { id: Date.now(), sender: 'user', text: promptInput };
        setChatMessages(prev => [...prev, userMsg]);
        const currentPrompt = promptInput;
        setPromptInput('');
        setIsGenerating(true);

        const languageInstruction = writingLanguage === 'English'
          ? 'Respond in pure English only. Keep grammar natural and polished, avoid Hindi words.'
          : writingLanguage === 'Hindi'
            ? 'Respond in Hindi only. Use natural Hindi prose and avoid English phrases unless absolutely necessary.'
            : 'Respond in natural Hinglish. Mix Hindi and English smoothly, keep the sentence readable, and use English words only where they fit naturally. Keep the tone conversational and modern.';

        try {
          let responseText = '';
          if (geminiApiKey.trim()) {
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${geminiApiKey.trim()}`;
            const sysInstruction = `You are FictionFlix AI. Active Agent Mode: ${agentMode}. ${languageInstruction}`;
            const payload = {
              contents: [{ parts: [{ text: `Current chapter draft:\n${currentChapter.content}\n\nUser instruction (${agentMode} mode): ${currentPrompt}` }] }],
              systemInstruction: { parts: [{ text: sysInstruction }] }
            };
            const res = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const data = await res.json();
            responseText = data.candidates?.[0]?.content?.parts?.[0]?.text || 'API Error';
          } else {
            await new Promise(r => setTimeout(r, 1100));
            if (agentMode === 'Co-Writer') {
              if (writingLanguage === 'English') {
                responseText = `[Co-Writer AI suggestion]:\nThe corridor went silent for a moment as the old manuscript trembled in the cold air, and the hidden doorway slowly began to open...`;
              } else if (writingLanguage === 'Hindi') {
                responseText = `[Co-Writer AI सुझाव]:\nउस समय गलियारा अचानक बिल्कुल शांत हो गया, जैसे पुरानी पांडुलिपि ठंडी हवा में कांप रही हो, और छिपा दरवाज़ा धीरे-धीरे खुलने लगा...`;
              } else {
                responseText = `[Co-Writer AI suggestion]:\nअचानक corridor का silence ho gaya, aur पुरानी manuscript ठंडी हवा में कांपने लगी, जैसे hidden door धीरे-धीरे open होने वाला हो...`;
              }
            } else if (agentMode === 'Outliner') {
              if (writingLanguage === 'English') {
                responseText = `[Outliner Plan]:\n1. Reveal the hidden map and identify the forgotten chamber.\n2. Show the first clue hidden behind the cracked wall.\n3. Introduce a sudden sound from the basement entrance.`;
              } else if (writingLanguage === 'Hindi') {
                responseText = `[अध्याय आउटलाइन]:\n1. छिपा नक्शा दिखाकर भूली हुई कोठरी का पता लगाएं।\n2. दरारदार दीवार के पीछे पहला सुराग दिखाएं।\n3. तहखाने के द्वार से अचानक आवाज़ सुनाई दे।`;
              } else {
                responseText = `[Outliner Plan]:\n1. Hidden map reveal karke forgotten chamber ka clue dhoondo.\n2. Cracked wall ke peeche first clue reveal karo.\n3. Basement entrance se sudden sound trigger karo, aur suspense badao.`;
              }
            } else {
              if (writingLanguage === 'English') {
                responseText = `[Polisher Enhancement]:\nThe ancient hall stood still beneath the moonlight, while the shadows around the door seemed to breathe with a life of their own.`;
              } else if (writingLanguage === 'Hindi') {
                responseText = `[शैली परिष्करण]:\nचाँद की रोशनी में प्राचीन大厅 स्थिर खड़ा था, जबकि दरवाज़े के आसपास के अँधेरे में जैसे किसी जीवंत साँस की हलचल आ रही हो।`;
              } else {
                responseText = `[Polisher Enhancement]:\nThe ancient hall stood still under moonlight, aur shadows around the door seem to breathe with their own eerie life, like the whole place is holding its breath.`;
              }
            }
          }

          setChatMessages(prev => [...prev, { id: Date.now() + 1, sender: 'agent', mode: agentMode, text: responseText }]);
        } catch (err) {
          setChatMessages(prev => [...prev, { id: Date.now() + 1, sender: 'agent', mode: agentMode, text: `त्रुटि: AI सेवा कनेक्ट नहीं हो सकी।` }]);
        } finally {
          setIsGenerating(false);
        }
      };

      const updateContent = (newText) => {
        setChapters(prev => prev.map(ch => ch.id === activeChapterId ? { ...ch, content: newText } : ch));
      };

      const handleAddNewChapter = () => {
        const newId = chapters.length + 1;
        const newChap = {
          id: newId,
          number: `०${newId}`,
          title: `अध्याय ${newId}: नया अध्याय`,
          isBookmarked: false,
          image: null,
          imageAlign: 'center',
          imageScale: 100,
          content: `यहाँ से अध्याय ${newId} लिखना प्रारंभ करें...`
        };
        setChapters([...chapters, newChap]);
        setActiveChapterId(newId);
        triggerToast(`नया अध्याय ${newId} जोड़ा गया!`, 'fa-plus');
      };

      const wordsCount = currentChapter.content.trim().split(/\s+/).filter(Boolean).length;
      const charCount = currentChapter.content.length;

      return (
        <div className="h-screen w-screen flex flex-col bg-brand-black text-slate-200 overflow-hidden font-sans select-none">
          
          <header className="h-16 border-b border-brand-border bg-brand-darker/95 backdrop-blur px-5 flex items-center justify-between z-30 shrink-0">
            <div className="flex items-center gap-4">
              <button 
                onClick={() => setShowLeftDrawer(true)}
                title="Gemini Style Left Menu"
                className="p-2.5 rounded-xl bg-brand-card border border-brand-border text-slate-300 hover:text-white hover:border-brand-yellow transition-all">
                <i className="fa-solid fa-bars text-lg"></i>
              </button>

              <div className="flex items-center cursor-pointer">
                <div className="leading-none">
                  <div className="font-rozha text-[2.2rem] leading-[0.8] tracking-[-0.08em]">
                    <span className="text-white">Fiction</span><span className="text-brand-red">Flix</span>
                  </div>
                  <div className="mt-0.5 text-[7px] font-extrabold tracking-[0.34em] text-brand-yellow uppercase">Film, Play, Stream</div>
                </div>
              </div>
            </div>

            <div className="flex items-center gap-2 sm:gap-3">
              <button 
                onClick={() => setShowTranslateModal(true)}
                className="hidden xl:flex items-center gap-1.5 text-xs font-bold px-3 py-2 rounded-xl bg-brand-card border border-brand-border hover:border-brand-yellow text-slate-200">
                <i className="fa-solid fa-language text-brand-yellow"></i>
                <span>Translate</span>
              </button>

              <button 
                onClick={() => setShowNotesModal(true)}
                className="hidden xl:flex items-center gap-1.5 text-xs font-bold px-3 py-2 rounded-xl bg-brand-card border border-brand-border hover:border-emerald-500 text-slate-200">
                <i className="fa-solid fa-sitemap text-emerald-400"></i>
                <span>Story Bible</span>
              </button>

              <button 
                onClick={() => setShowReaderMode(true)}
                className="flex items-center gap-2 text-xs font-bold px-3.5 py-2 rounded-xl bg-brand-card border border-brand-border text-slate-200 hover:text-brand-red">
                <i className="fa-solid fa-book-open text-brand-red text-sm"></i>
                <span className="hidden md:inline">Reader</span>
              </button>

              <button 
                onClick={() => setShowRightChatDrawer(!showRightChatDrawer)}
                title="AI Chatbot Right Menu"
                className={`p-2.5 rounded-xl border transition-all flex items-center gap-2 ${
                  showRightChatDrawer ? 'bg-brand-red/25 border-brand-red text-brand-red' : 'bg-brand-card border-brand-border text-slate-300 hover:border-brand-red'
                }`}>
                <i className="fa-solid fa-robot text-sm"></i>
                <span className="text-xs font-bold hidden sm:inline">AI Agent ({agentMode})</span>
              </button>
            </div>
          </header>

          {showLeftDrawer && (
            <div className="fixed inset-0 z-50 flex">
              <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" onClick={() => setShowLeftDrawer(false)}></div>

                  </div>

                  <div className="bg-brand-darker p-3 rounded-xl border border-brand-border space-y-2">
                    <span className="text-[11px] font-bold text-slate-300 block">+ नया वर्ल्ड लोर जोड़ें:</span>
                    <div className="flex gap-2">
                      <input 
                        type="text" 
                        value={newLoreTitle} 
                        onChange={e => setNewLoreTitle(e.target.value)} 
                        placeholder="शीर्षक..." 
                        className="w-1/3 bg-brand-black border border-brand-border rounded-lg px-2.5 py-1.5 text-xs text-white outline-none"
                      />
                      <input 
                        type="text" 
                        value={newLoreDetail} 
                        onChange={e => setNewLoreDetail(e.target.value)} 
                        placeholder="लोर विवरण..." 
                        className="flex-1 bg-brand-black border border-brand-border rounded-lg px-2.5 py-1.5 text-xs text-white outline-none"
                      />
                      <button 
                        onClick={() => {
                          if (!newLoreTitle.trim()) return;
                          setWorldLore([...worldLore, { id: Date.now(), title: newLoreTitle, detail: newLoreDetail }]);
                          setNewLoreTitle('');
                          setNewLoreDetail('');
                          triggerToast('नया वर्ल्ड लोर जोड़ा गया!', 'fa-plus');
                        }}
                        className="bg-brand-yellow/20 hover:bg-brand-yellow text-brand-yellow hover:text-brand-black border border-brand-yellow font-bold px-3 py-1.5 rounded-lg text-xs transition-all">
                        + जोड़ें
                      </button>
                    </div>
                  </div>
                </div>

              </div>
            </div>
          )}

          {showTranslateModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-brand-card border border-brand-border rounded-3xl w-full max-w-md p-6 shadow-2xl">
                <div className="flex items-center justify-between border-b border-brand-border pb-4 mb-4">
                  <h3 className="text-base font-bold text-white flex items-center gap-2">
                    <i className="fa-solid fa-language text-brand-yellow"></i> Whole Book Translation
                  </h3>
                  <button onClick={() => setShowTranslateModal(false)} className="text-slate-400"><i className="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <div className="grid grid-cols-2 gap-2 text-xs">
                  {['English', 'Hindi', 'Spanish', 'French'].map((lang) => (
                    <button key={lang} onClick={() => handleTranslateBook(lang)} className="p-3 bg-brand-panel border border-brand-border hover:border-brand-yellow rounded-xl font-bold text-white text-center">
                      {lang}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const mountApp = () => {
      try {
        const rootEl = document.getElementById('root');
        if (rootEl) ReactDOM.createRoot(rootEl).render(<FictionFlixStudio />);
      } catch (err) { console.error(err); }
    };
    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', mountApp); } else { mountApp(); }
  </script>
</body>
</html>
